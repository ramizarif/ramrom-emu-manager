name: Bug report
description: Something in the app doesn't work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Requests for games, BIOS files or keys, or where to find them, are closed without a reply.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: AYN Thor, Android 13
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Settings › About
    validations:
      required: true
  - type: dropdown
    id: access
    attributes:
      label: Access mode
      options:
        - Elevated (Shizuku)
        - Limited
        - Not sure
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: Problem report
      description: |
        Settings › Report a problem saves a text file. Attach it or paste it here. It leaves out
        game names; read it before posting anyway.
  - type: textarea
    id: screens
    attributes:
      label: Screenshots
      description: Optional, but they help a lot.
