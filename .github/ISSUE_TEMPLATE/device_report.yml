name: Device report
description: Tell us how setup went on your handheld, good or bad.
labels: [device]
body:
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Retroid Pocket 5, Android 13
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
    validations:
      required: true
  - type: dropdown
    id: detected
    attributes:
      label: Was the device detected?
      options:
        - Yes, by name
        - No, I picked it
        - No, I chose "Another Snapdragon handheld"
    validations:
      required: true
  - type: textarea
    id: systems
    attributes:
      label: Systems and frontends you set up
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: How it went
      description: What Health showed at the end, and anything you had to fix by hand.
    validations:
      required: true
